name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    name: Build & vet (windows/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: go vet
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...
      - name: go build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  test:
    name: Test (platform-independent packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: go test
        run: go test ./internal/layout/... ./internal/config/... ./internal/state/... ./internal/applog/...
